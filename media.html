<!DOCTYPE HTML>
<html>
	<head>
		<title>
			@media
		</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">

		<style>
			body{
				background-color:red;
				font-size:90px;
			}
			.myclass{
				font-size:90px;
			}
			@media (min-width: 768px) {
			  body { background-color: lightblue; font-size:70px; color:red;}
			  .myclass{
				color:yellow;
			  }
			}
		</style>
	</head>
	<body>
		hello welcome to media query
		<p class="myclass">
			hi
		</p>
	</body>
</html>
