<!DOCTYPE HTML>
<html>
	<head>
		<title>
			transition
		</title>
		<style>
			div{
				height:300px;
				width:300px;
				background-color:red;
				transition: width 2s linear 1s, height 2s linear 1s;

			}
			div:hover{
				width:400px;
				height:400px;
			}
		</style>
	</head>
	<body>
		<div>
			
		</div>
	</body>
</html>
