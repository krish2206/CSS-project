<!DOCTYPE HTML>
<html>
	<head>
		<title>
			dropdown
		</title>
		<style>
			.drop{
				position:relative; 
				background-color:yellow;
				width:200px;
			}
			.drop-content{
				display:none;
				background-color:blue;
				color:white;
			}
			.drop:hover .drop-content{
				display:block;
			}
		</style>
	</head>
	<body>
		<div class="drop">
			<span>hover me</span>
			<div class="drop-content">
				<p>1</p>
				<p>2</p>
				<p>3</p>
				<p>4</p>
				<p>5</p>
			</div>
		</div>
	</body>
</html>
